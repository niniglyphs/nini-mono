# gftools builder recipe: `gftools builder sources/config.yaml` builds fonts/ttf and fonts/webfonts from these UFOs.
sources:
  - NiniMono-Thin.ufo
  - NiniMono-Light.ufo
  - NiniMono-Regular.ufo
  - NiniMono-SemiBold.ufo
  - NiniMono-Bold.ufo
  - NiniMono-ThinItalic.ufo
  - NiniMono-LightItalic.ufo
  - NiniMono-Italic.ufo
  - NiniMono-SemiBoldItalic.ufo
  - NiniMono-BoldItalic.ufo
familyName: Nini Mono
buildVariable: false
buildOTF: false
autohintTTF: false
buildWebfont: false
